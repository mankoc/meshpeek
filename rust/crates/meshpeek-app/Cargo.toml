[package]
name = "meshpeek-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "meshpeek"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
eframe = { version = "0.32.3", default-features = false, features = ["wgpu", "default_fonts", "persistence", "wayland", "x11"] }
egui-wgpu = "0.32.3"
env_logger = "0.11.11"
glam = "0.34.1"
image = { version = "0.25.9", default-features = false, features = ["png"] }
log = "0.4.34"
memory-stats = "1.2.0"
meshpeek-core = { version = "0.1.0", path = "../meshpeek-core" }
meshpeek-render = { version = "0.1.0", path = "../meshpeek-render" }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
