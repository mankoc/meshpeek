[workspace]
resolver = "3"
members = ["crates/meshpeek-core", "crates/meshpeek-tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/mankoc/STL_viewer"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2  # dependencies optimised even in debug builds: big meshes stay usable while developing
