[package]
name = "chitu2lys"
description = "Converts CHITUBOX projects (.chitubox) into Lychee Slicer scenes (.lys)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "chitu2lys"
path = "src/main.rs"

[[bin]]
name = "chitu2lys-gui"
path = "src/gui.rs"

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
glam = "0.34.1"
image = { version = "0.25.9", default-features = false, features = ["png"] }
meshpeek-core = { version = "0.4.1", path = "../crates/meshpeek-core" }
rfd = "0.17.2"
rmpv = "1.3.1"
serde_json = "1.0.151"
# eframe draws with wgpu but enables no graphics backend itself; wgpu's defaults (DX12, Vulkan, Metal, OpenGL) do
wgpu = "=25.0.2"
