[package]
name = "meshpeek-thumbs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Windows Explorer thumbnails for the files MeshPeek opens"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glam = "0.34.1"
meshpeek-core = { version = "0.5.11", path = "../meshpeek-core" }
rayon = "1.12.0"

[dev-dependencies]
image = { version = "0.25.9", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = ["implement", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }
windows-core = "0.58.0"
