[package]
name = "meshpeek-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["io"]
# Loading files (everything but meshes, scenes and the wire format); off in a web viewer.
io = ["dep:aes", "dep:base64", "dep:delaunator", "dep:fast-float2", "dep:flate2", "dep:memchr", "dep:memmap2", "dep:rmpv", "dep:serde_json", "dep:zip"]

[dependencies]
aes = { version = "0.8.4", optional = true }
base64 = { version = "0.22.1", optional = true }
delaunator = { version = "1.0.2", optional = true }
fast-float2 = { version = "0.2.4", optional = true }
flate2 = { version = "1.1.10", optional = true }
glam = "0.34.1"
memchr = { version = "2.8.3", optional = true }
memmap2 = { version = "0.9.11", optional = true }
rayon = "1.12.0"
rmpv = { version = "1.3.1", optional = true }
serde_json = { version = "1.0.151", optional = true }
thiserror = "2.0.21"
zip = { version = "9.0.5", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
