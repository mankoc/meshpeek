[package]
name = "meshpeek-app"
description = "Fast viewer for STL, OBJ, PLY, 3MF, Lychee .lys and CHITUBOX .chitubox files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "meshpeek"
path = "src/main.rs"

[dependencies]
directories = "6.0.0"
eframe = { version = "0.32.3", default-features = false, features = ["wgpu", "default_fonts", "persistence", "wayland", "x11"] }
env_logger = "0.11.11"
glam = "0.34.1"
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native", "linux-native-basic-udev"] }
image = { version = "0.25.9", default-features = false, features = ["png"] }
log = "0.4.34"
memory-stats = "1.2.0"
meshpeek-core = { version = "0.5.0", path = "../meshpeek-core" }
meshpeek-render = { version = "0.5.0", path = "../meshpeek-render" }
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sevenz-rust2 = "0.20.2"
toml = "1.1.8"
unrar = "0.5.8"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1.31"

# Linux package: `cargo deb -p meshpeek-app` (see .github/workflows/release.yml)
[package.metadata.deb]
name = "meshpeek"
maintainer = "MeshPeek contributors"
copyright = "MeshPeek contributors"
extended-description = """\
Fast viewer for STL, OBJ, PLY, 3MF, Lychee .lys and CHITUBOX .chitubox files. Renders on the GPU, or on the CPU when no GPU \
is available (Mesa lavapipe)."""
depends = "$auto, mesa-vulkan-drivers"
section = "graphics"
priority = "optional"
assets = [
    ["target/release/meshpeek", "usr/bin/", "755"],
    ["assets/meshpeek.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/256x256/apps/meshpeek.png", "644"],
    ["../../LICENSE", "usr/share/doc/meshpeek/", "644"],
    ["target/release/THIRD-PARTY-LICENSES.html", "usr/share/doc/meshpeek/", "644"],
    ["assets/99-meshpeek-spacemouse.rules", "lib/udev/rules.d/", "644"],
]
