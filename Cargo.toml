[workspace]
resolver = "3"
members = ["crates/meshpeek-core", "crates/meshpeek-render", "crates/meshpeek-app", "crates/meshpeek-tools"]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/mankoc/meshpeek"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2  # dependencies optimised even in debug builds: big meshes stay usable while developing
