name: Rust

on:
  push:
    paths: ["rust/**", "samples/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "samples/**", ".github/workflows/rust.yml"]

defaults:
  run:
    working-directory: rust

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # sample models for the golden tests
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Linux system libraries (window, input, file dialogs, software Vulkan)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libgtk-3-dev mesa-vulkan-drivers
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
