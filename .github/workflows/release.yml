name: Release

# Builds the installers: an MSI for Windows and a .deb for Linux.
# Push a tag like `v0.1.0` to publish them as a GitHub release, or run the workflow manually to only build them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

defaults:
  run:
    working-directory: rust

jobs:
  windows-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install WiX Toolset 3
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.1 -y --no-progress
          "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: cargo install cargo-wix --locked
      - name: Build MSI
        run: cargo wix -p meshpeek-app --nocapture --output target/wix/
      - uses: actions/upload-artifact@v4
        with:
          name: meshpeek-windows-msi
          path: rust/target/wix/*.msi

  linux-deb:
    runs-on: ubuntu-22.04 # older glibc: the package also installs on older distributions
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libgtk-3-dev
      - run: cargo install cargo-deb --locked
      - name: Build .deb
        run: cargo deb -p meshpeek-app
      - uses: actions/upload-artifact@v4
        with:
          name: meshpeek-linux-deb
          path: rust/target/debian/*.deb

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-msi, linux-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
