name: Release

# Push a tag v<version> (the version in Cargo.toml) to build everything and publish a GitHub release:
#   git tag v0.2.0 && git push origin v0.2.0
# The release gets the Windows zip + MSI and the Linux tar.gz + .deb; its text is the version's section of CHANGELOG.md.

on:
  push:
    tags: ["v*"]

jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the version in Cargo.toml
        run: |
          version=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi

  build:
    needs: check-tag
    permissions:
      contents: write # the reused workflow has an optional publish job that asks for it
    uses: ./.github/workflows/build-packages.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # the section "## <version> - <date>" up to the next "## " heading, without the heading itself
          awk -v v="$version" '/^## /{ found = ($2 == v); next } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for version ${version}"
            exit 1
          fi
          cat notes.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: MeshPeek ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
